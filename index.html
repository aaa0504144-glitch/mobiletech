<title>מובייל טק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Assistant:wght@400;600;700&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: shop-counter tool. Phone = stacked cards + bottom bar; desktop = side rail + two-column list. */
:root{
  --bg:var(--user-bg,#eef3f5);
  --card:#ffffff;
  --ink:#14232b;
  --muted:#5b6d76;
  --line:#d9e3e8;
  --brand:var(--user-brand,#0e7490);
  --on-brand:#ffffff;
  --brand-d:color-mix(in srgb,var(--brand) 78%,#000);
  --brand-l:color-mix(in srgb,var(--brand) 13%,var(--card));
  --ok:#15803d; --ok-l:#dcfce7;
  --warn:#a15c07; --warn-l:#fef3c7;
  --bad:#b91c1c; --bad-l:#fee2e2;
  --soft:#eef3f6;
  --shadow:0 3px 10px rgba(14,40,52,.10);
  --f-display:"Rubik","Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --f-body:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;
  --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181d;--card:#172329;--ink:#e6eef1;--muted:#93a6ae;--line:#2a3a42;--soft:#1f2e35;
  --ok:#4ade80;--ok-l:#12301d;--warn:#fbbf24;--warn-l:#3a2c0a;--bad:#f87171;--bad-l:#3a1414;
  --brand-d:color-mix(in srgb,var(--brand) 65%,#fff);
  --brand-l:color-mix(in srgb,var(--brand) 28%,var(--card));
  --shadow:0 3px 10px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d;--card:#172329;--ink:#e6eef1;--muted:#93a6ae;--line:#2a3a42;--soft:#1f2e35;
  --ok:#4ade80;--ok-l:#12301d;--warn:#fbbf24;--warn-l:#3a2c0a;--bad:#f87171;--bad-l:#3a1414;
  --brand-d:color-mix(in srgb,var(--brand) 65%,#fff);
  --brand-l:color-mix(in srgb,var(--brand) 28%,var(--card));
  --shadow:0 3px 10px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;direction:rtl;
  padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,.h2,.display{font-family:var(--f-display)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand);color:var(--on-brand);
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{margin:0;font-size:21px;font-weight:700;text-wrap:balance}
.top .sub{font-size:13px;opacity:.88;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#86efac;display:inline-block}
.dot.off{background:#fca5a5}
.back{background:rgba(255,255,255,.18);border:0;color:var(--on-brand);border-radius:10px;padding:8px 12px;font-weight:700}
main{padding-block:14px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:680px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.repair{cursor:pointer}
.repair:active{background:var(--soft)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted)} .sm{font-size:13px}
.nm{font-size:17px;font-family:var(--f-display);font-weight:500}
.items{margin:6px 0;color:var(--ink);opacity:.9}
.price{font-weight:700;font-size:18px;color:var(--brand-d);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.st-progress{background:var(--warn-l);color:var(--warn)}
.st-ready{background:var(--brand-l);color:var(--brand-d)}
.st-delivered{background:var(--ok-l);color:var(--ok)}
.warr{margin-top:8px;font-size:14px;border-radius:8px;padding:6px 10px}
.warr.ok{background:var(--ok-l);color:var(--ok)}
.warr.pending{background:var(--soft);color:var(--muted)}
.warr.expired{background:var(--bad-l);color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;text-align:center}
.stat b{display:block;font-size:28px;font-family:var(--f-display);color:var(--brand-d);font-variant-numeric:tabular-nums}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=password],textarea{
  width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--brand)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;font-weight:700;margin:12px 0 5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:700;color:var(--muted)}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--line);background:var(--card);border-radius:var(--radius);padding:16px 8px;font-weight:700;font-size:17px;text-align:center;font-family:var(--f-display)}
.tile.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.opt.on{border-color:var(--brand);background:var(--brand-l)}
.opt .nmx{flex:1;font-weight:700;min-width:0}
.opt input[type=checkbox]{width:24px;height:24px;accent-color:var(--brand);flex:0 0 auto}
.opt .pw{width:96px;flex:0 0 auto}
.opt .pw input{padding:9px 8px;text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:11px 6px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--brand);color:var(--on-brand)}
.btn{display:inline-block;border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:16px;background:var(--brand);color:var(--on-brand);text-align:center;text-decoration:none}
.btn.sec{background:var(--card);color:var(--brand-d);border:1.5px solid var(--brand)}
.btn.red{background:var(--card);color:var(--bad);border:1.5px solid var(--bad)}
.btn.redfill{background:var(--bad);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.block{width:100%;display:block}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btns .full{grid-column:1/-1}
.sticky{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:9}
.sticky .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky .tot{flex:1;font-size:13px;color:var(--muted)}
.sticky .tot b{display:block;font-size:22px;color:var(--brand-d);font-family:var(--f-display);font-variant-numeric:tabular-nums}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.bottom button{border:0;background:none;padding:9px 2px 8px;color:var(--muted);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bottom button .ic{font-size:21px;line-height:1}
nav.bottom button.on{color:var(--brand)}
nav.bottom button.plus .ic{background:var(--brand);color:var(--on-brand);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;margin-top:-15px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.err{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.note{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.info{background:var(--brand-l);color:var(--brand-d);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.pl-row{display:grid;grid-template-columns:1fr 92px 38px;gap:8px;align-items:center;margin-bottom:8px}
.pl-row input{padding:9px 10px}
.x{border:0;background:var(--bad-l);color:var(--bad);border-radius:8px;height:38px;font-size:17px}
.tag{font-size:11px;font-weight:700;background:var(--warn-l);color:var(--warn);border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.h2{font-size:18px;margin:0 0 8px;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:120;font-weight:700;max-width:90%;text-align:center}
.cust{display:grid;grid-template-columns:1fr 92px 38px;gap:8px;margin-bottom:8px}
.cust input{padding:10px}
.mgrid{display:grid;gap:10px}
.mblock{border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--soft)}
.mblock .mname{font-weight:700;direction:ltr;text-align:right}
.mp-row{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center;margin-bottom:6px}
.mp-row input{padding:9px 10px}
.mchips{display:flex;flex-wrap:wrap;gap:8px}
.mchip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-weight:700;font-size:17px;min-width:76px;direction:ltr}
.mchip.other{direction:rtl;font-weight:600}
.mchip.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.modal{position:fixed;inset:0;background:rgba(8,18,24,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.x-close{border:0;background:var(--soft);border-radius:10px;width:38px;height:38px;font-size:18px}
.scanimg{display:block;width:100%;max-height:34vh;object-fit:contain;border-radius:12px;background:var(--soft);margin-top:8px}
.rawtxt{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:8px;font-size:13px;margin:6px 0 0}
.tips{margin:0 0 10px;padding-inline-start:20px;color:var(--ink);font-weight:600}
.tips li{margin-bottom:3px}
.stickerbox{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:10px}
.stickerimg{display:block;max-width:100%;max-height:150px;border-radius:10px;border:1px solid var(--line);background:var(--soft);object-fit:contain}
.stickerimg.big{max-height:320px;margin:0 auto}
.stats.three{grid-template-columns:repeat(3,1fr)}
.flags{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.flag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;background:var(--soft);color:var(--ink)}
.flag.due{background:var(--bad-l);color:var(--bad)}
.flag.paid{background:var(--ok-l);color:var(--ok)}
.flag.warr{background:var(--brand-l);color:var(--brand-d)}
.linkbtn{border:0;background:none;color:var(--brand-d);font-weight:700;text-decoration:underline;padding:0;cursor:pointer}
.flag.stale{background:var(--warn-l);color:var(--warn)}
.payrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.payrow:last-child{border-bottom:0}
.x.sm{height:30px;width:30px;font-size:14px}
.paychips{padding:0;margin:0}
.paidok{margin-top:10px;background:var(--ok-l);color:var(--ok);border-radius:10px;padding:8px 12px;font-weight:700}
.duetxt{color:var(--bad)} .paidtxt{color:var(--ok)}
.internal{background:var(--warn-l)}
.internalnote{margin-top:10px;background:var(--warn-l);color:var(--warn);border-radius:10px;padding:8px 12px;font-weight:600}
.btns .full{grid-column:1/-1}
.jhead{text-align:center}
.jdate{font-size:26px;font-weight:700;color:var(--brand-d);margin-bottom:10px}
.jstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.jstats div{background:var(--soft);border-radius:12px;padding:10px 4px;font-size:13px;color:var(--muted)}
.jstats b{display:block;font-size:22px;color:var(--ink);font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sect{margin:18px 0 8px}
.jrow .items{margin:4px 0 8px}
.sumbig{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--brand-d);margin-bottom:10px}
.sumhead{text-align:center}
.bar{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;margin-bottom:8px}
.bartrack{background:var(--soft);border-radius:99px;height:12px;overflow:hidden}
.barfill{background:var(--brand);height:100%;border-radius:99px}
.certprev{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff}
.terms{margin-top:14px;max-height:150px;overflow:auto;background:var(--soft);border-radius:12px;padding:12px;font-size:16px;line-height:1.6}
.agree{display:flex;align-items:center;gap:10px;margin-top:12px;font-weight:700;font-size:17px}
.agree input{width:26px;height:26px;accent-color:var(--brand)}
.sigpad{display:block;width:100%;height:150px;border:2px dashed var(--line);border-radius:12px;background:#fff;touch-action:none;margin-top:6px}
.sigimg{display:block;max-width:240px;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f87171;margin-inline-start:4px;vertical-align:middle}
.pdot.on{background:#4ade80}
.kprint{font-weight:700;color:var(--brand-d)}
.kst{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.kst .ki{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}
.kst .ki b{display:block;font-size:14px;margin-bottom:2px}
.kst .on{color:var(--ok)} .kst .off{color:var(--bad)} .kst .na{color:var(--muted)}
.kwarn{cursor:pointer;font-weight:600;position:fixed;left:0;right:0;bottom:0;text-align:center;font-size:13px;color:var(--warn);background:var(--warn-l);padding:6px 50px calc(6px + env(safe-area-inset-bottom,0px))}
.login{max-width:380px;margin:12vh auto;text-align:center}
.login .big{font-size:48px}
.sel{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.acc{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);direction:ltr}
.kask{margin-top:16px;padding:10px 12px;border-radius:10px;background:var(--warn-l);color:var(--warn);font-weight:700;font-size:17px;text-align:center}
.khand{font-size:24px;font-weight:700;color:var(--brand-d);margin:12px 0}
.kpaid{font-size:18px;margin:8px 0}
.kline{margin-top:3px}
.kalerts{display:grid;gap:6px;margin-bottom:8px}
.kalert{background:var(--bad-l);color:var(--bad);border-radius:10px;padding:9px 12px;font-weight:700}
.ntlist.dim{opacity:.5}
.ntcode{direction:ltr;text-align:center;font-size:17px;padding:10px;margin:8px 0;border:1.5px dashed var(--line);border-radius:10px;user-select:all;word-break:break-all}
.lookchips{margin:0}
.kwiz{display:grid;grid-template-columns:1fr;gap:18px;padding:22px}
@media (orientation:landscape) and (min-width:700px){.kwiz{grid-template-columns:minmax(300px,0.9fr) 1.25fr;align-items:center;gap:26px}}
.kwiz .kstore{font-size:30px}
.kwiz .ksub{font-size:17px;margin:4px 0 8px}
.kstep{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:15px;margin:6px 0}
.kstep span{width:26px;height:6px;border-radius:3px;background:var(--line)}
.kstep span.on{background:var(--brand)}
.kstep span.done{background:color-mix(in srgb,var(--brand) 45%,var(--card))}
.kstep b{margin-inline-start:6px;font-weight:600}
.kq{font-size:28px;font-weight:700;text-align:center;margin:6px 0 10px;font-family:var(--f-display)}
.kfield{min-height:66px;border:2px solid var(--brand);border-radius:14px;padding:12px 16px;font-size:30px;font-weight:700;background:var(--card);display:flex;align-items:center;gap:2px;overflow:hidden;white-space:nowrap}
.kfield.num{direction:ltr;justify-content:flex-start;font-variant-numeric:tabular-nums;letter-spacing:1px}
.kph{color:var(--muted);font-weight:400;font-size:22px}
.kcaret{display:inline-block;width:3px;height:34px;background:var(--brand);animation:kblink 1s steps(1) infinite}
@keyframes kblink{50%{opacity:0}}
.kerr{margin-top:10px;font-size:18px}
.knav{display:flex;gap:10px;margin-top:16px}
.knav .btn{margin-top:0;flex:1;font-size:22px;padding:16px}
.knav .kback{flex:0 0 34%}
.kbd{display:flex;flex-direction:column;gap:8px}
.krow{display:flex;gap:6px;justify-content:center;direction:ltr}
.kk:focus{outline:none}
.kk{flex:1;min-width:0;min-height:60px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:26px;font-weight:600;box-shadow:0 2px 0 var(--line);font-family:var(--f-display);touch-action:manipulation;user-select:none}
.kk:active{background:var(--brand-l);transform:translateY(1px)}
.kk.kfn{flex:1.4;font-size:18px;background:var(--soft)}
.kk.kspace{flex:4;font-size:18px}
.kidle{position:fixed;inset:0;z-index:200;background:rgba(10,20,25,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.kidlebox{background:var(--card);border-radius:22px;padding:30px 34px;text-align:center;width:min(460px,100%);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.kidleq{font-size:32px;font-weight:700;font-family:var(--f-display)}
.kidlenum{font-size:84px;font-weight:700;color:var(--bad);line-height:1.1;margin:8px 0;font-family:var(--f-display)}
.kidlebox p{font-size:19px;color:var(--muted);margin:0 0 16px}
.kidlego{font-size:24px;padding:18px}
.kpad{direction:ltr;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:440px;margin:auto;width:100%}
.kpad .kk{min-height:72px;font-size:32px}
.kpad .kk.kfn{font-size:20px}
.online{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:10px}
.who1{color:var(--ok);font-weight:600}.who1.me{color:var(--brand-d)}
.chip .cnt{font-size:12px;background:rgba(0,0,0,.08);border-radius:10px;padding:1px 6px;margin-inline-start:3px}
.chip.on .cnt{background:rgba(255,255,255,.25)}
.scard .nm{font-size:18px;font-weight:700;color:var(--ink);text-decoration:none;padding:0;text-align:right}
.scard.g-new{border-inline-start:5px solid #2563eb}.scard.g-part{border-inline-start:5px solid #d97706}.scard.g-ready{border-inline-start:5px solid var(--ok)}.scard.g-declined{border-inline-start:5px solid var(--bad)}.scard.g-delivered{opacity:.85}
.badge.sb-new{background:#dbeafe;color:#1d4ed8}.badge.sb-part{background:var(--warn-l);color:var(--warn)}.badge.sb-ready{background:var(--ok-l);color:var(--ok)}.badge.sb-declined{background:var(--bad-l);color:var(--bad)}.badge.sb-delivered{background:var(--soft);color:var(--muted)}
.scard .num{white-space:nowrap}
.sprice{background:none;border:none;padding:0;font-size:20px;font-weight:700;color:var(--brand-d);font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap}
.snote{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:14px;margin-top:6px}
.who{font-size:13px;color:var(--muted);margin-top:6px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}.sbtns.three{grid-template-columns:1fr 1fr 1fr}.sbtns.one{grid-template-columns:1fr}
.sbtns .btn{margin:0;padding:11px 4px;font-size:15px}
.btn.g{background:var(--ok);color:#fff}.btn.y{background:#d97706;color:#fff}.btn.r{background:var(--bad);color:#fff}.btn.bl{background:var(--brand);color:#fff}
.smini{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.smini .btn{margin:0}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.setrow:last-of-type{border-bottom:none}
.sw{flex:none;width:52px;height:30px;border-radius:15px;border:none;background:#cbd5e1;position:relative;cursor:pointer;padding:0}
.sw span{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:right .15s}
.sw.on{background:var(--brand)}.sw.on span{right:25px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.wopt{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--card);color:var(--ink);font-weight:700;font-size:17px}
.wopt.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d)}
.paygrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.paygrid .btn{margin:0}
.copy{text-align:center;color:var(--muted);font-size:12px;padding:18px 0 4px}
button.stat{font:inherit;color:inherit;cursor:pointer}
.searchrow{display:flex;gap:8px}
.searchrow input{flex:1;min-width:0}
.scanbtn{padding:10px 14px;flex:0 0 auto}
.st-waiting{background:var(--soft);color:var(--ink);border:1px dashed var(--muted)}
.waitcard{border-style:dashed}
.ticketbig{font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--brand-d);text-align:center;margin:6px 0}
.labelprev{display:block;width:100%;max-width:420px;margin:0 auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.steps{margin:12px 0 0;padding-inline-start:20px;color:var(--muted)}

body.kiosk nav.bottom,body.kiosk .top,body.kiosk #sticky{display:none}

.kwrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;box-shadow:var(--shadow)}
.kstore{font-size:34px;font-weight:700;color:var(--brand-d);text-align:center}
.ksub{text-align:center;font-size:19px;margin:6px 0 10px}
.kin{font-size:24px!important;padding:16px!important}
.kgo{margin-top:18px;font-size:22px;padding:18px}

function parseDay(s){var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDate(x){if(!x)return '';var d=(x instanceof Date)?x:parseDay(x);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function addMonths(s,m){var d=parseDay(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+m);var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return d;}

function warrantyInfo(r){
  if(!r.completedAt)return {state:'pending',text:'אחריות '+r.warrantyMonths+' חודשים, מתחילה בסיום התיקון'};
  var end=addMonths(r.completedAt,r.warrantyMonths);
  var days=Math.round((end-parseDay(todayStr()))/864e5);
  if(days>=0){
    var extra='';
    if(days===0)extra=' (היום האחרון)';else if(days===1)extra=' (נשאר יום אחד)';else if(days<=14)extra=' (נשארו '+days+' ימים)';
    return {state:'ok',text:'באחריות עד '+fmtDate(end)+extra};
  }
  return {state:'expired',text:'האחריות הסתיימה ב-'+fmtDate(end)};
}

function writeFail(e){
  var code=e&&e.code;
  if(code==='permission-denied')toast('אין לך הרשאה לשמור. בעל החנות צריך להוסיף את המייל שלך.');
  else if(code==='resource-exhausted')toast('המקום במסד הנתונים מלא. צריך למחוק תיקונים ישנים.');
  else toast('השמירה נכשלה. בדוק את החיבור לאינטרנט ונסה שוב.');
  throw e;
}
function writeRepair(r){
  if(!store){toast('אין חיבור לנתונים');return Promise.reject();}
  return store.doc('repairs/'+r.id).set(clone(r)).catch(writeFail);
}
function removeRepair(id){

var catBusy=false,catDirty=false;
function saveCatalog(){
  if(!store)return;
  if(catBusy){catDirty=true;return;}
  catBusy=true;
  store.doc('config/catalog').set({catalog:clone(S.catalog)}).catch(function(e){try{writeFail(e);}catch(x){}}).then(function(){

}

    S.settings=s.exists?clone(s.data()||{}):{};

  },connLost);

    S.repairs=q.docs.map(function(d){return clone(d.data());}).sort(function(a,b){
      return (b.createdTs||0)-(a.createdTs||0)||String(b.createdAt).localeCompare(String(a.createdAt));
    });

/* ---------- טופס תיקון ---------- */
function newForm(){return {editingId:null,catId:null,sel:{},custom:[],origin:'store',name:'',phone:'',device:'',model:'',modelOther:false,notes:'',error:'',stickerImg:'',stickerBlob:null,stickerId:null,scanMsg:'',scanOk:false,internal:'',deposit:'',depMethod:'cash',jlmPreset:false};}
var VENDOR='ווקסברגר',VENDOR_CATS=['projector','octo'];
function basePrice(c,i,f){
  if(f.warrantyOf||f.vendorW)return '0';
  if(c.models&&f.model&&!f.modelOther){var p=i.prices?i.prices[f.model]:null;return p==null?'':String(p);}
  return i.price==null?'':String(i.price);
}
function initSel(f){f.sel={};var c=cat(f.catId);if(!c)return;c.items.forEach(function(i){f.sel[i.id]={on:false,price:basePrice(c,i,f)};});}
function repriceSel(f){var c=cat(f.catId);if(!c)return;c.items.forEach(function(i){var s=f.sel[i.id]||(f.sel[i.id]={on:false,price:''});s.price=basePrice(c,i,f);});}
function formFromRepair(r){
  var f=newForm();
  f.catId=r.catId;f.editingId=r.id;f.origin=r.origin||'store';f.name=r.name;f.phone=r.phone;f.device=r.device||'';f.notes=r.notes||'';
  f.stickerId=r.sticker||null;f.internal=r.internal||'';f.vendorW=!!r.vendorWarranty;
  var rc=cat(r.catId);
  if(rc&&rc.models){f.device='';if(r.device){f.model=r.device;f.modelOther=rc.models.indexOf(r.device)<0;}}
  initSel(f);
  r.items.forEach(function(i){
    if(!i.custom&&f.sel[i.itemId])f.sel[i.itemId]={on:true,price:String(i.price)};
    else f.custom.push({name:i.name,price:String(i.price)});
  });
  return f;
}
function formTotal(f){
  var t=0;
  Object.keys(f.sel).forEach(function(k){if(f.sel[k].on)t+=Number(f.sel[k].price)||0;});
  f.custom.forEach(function(c){t+=Number(c.price)||0;});
  return t;
}
function buildRepair(){
  var f=form,c=cat(f.catId);
  f.error='';
  if(!c){f.error='בחר סוג מוצר';return null;}
  if(c.models&&!String(f.model).trim()){f.error='חובה לבחור את דגם המצלמה';return null;}
  var device=c.models?String(f.model).trim():f.device.trim();
  var items=[],bad=null;
  c.items.forEach(function(i){
    var s=f.sel[i.id];
    if(s&&s.on){
      if(!validPrice(s.price)){bad='חסר מחיר ל"'+i.name+'"';return;}
      items.push({itemId:i.id,name:i.name,price:Number(s.price),custom:false});
    }
  });
  f.custom.forEach(function(x){
    if(!x.name.trim()&&x.price==='')return;
    if(!x.name.trim()){bad='חסר שם לתיקון אחר';return;}
    if(!validPrice(x.price)){bad='חסר מחיר ל"'+x.name+'"';return;}
    items.push({name:x.name.trim(),price:Number(x.price),custom:true});
  });
  if(bad){f.error=bad;return null;}
  if(!items.length){f.error='בחר לפחות תיקון אחד';return null;}
  if(c.free&&!device){f.error='כתוב מה המכשיר';return null;}
  if(!f.name.trim()){f.error='חובה לרשום שם לקוח';return null;}
  if(String(f.phone).replace(/\D/g,'').length<9){f.error='חובה לרשום מספר טלפון תקין';return null;}
  var base={catId:f.catId,items:items,origin:c.jerusalem?f.origin:'store',name:f.name.trim(),phone:f.phone.trim(),device:device,notes:f.notes.trim(),internal:(f.internal||'').trim(),vendorWarranty:(f.vendorW&&VENDOR_CATS.indexOf(c.id)>-1)?VENDOR:null};
  var dep=Number(f.deposit);
  if(f.deposit!==''&&f.deposit!=null&&!(dep>=0)){f.error='המקדמה לא תקינה';return null;}
  var depPay=dep>0?{amount:dep,method:f.depMethod||'cash',at:todayStr(),ts:Date.now(),kind:'deposit'}:null;
  if(f.editingId){
    var old=S.repairs.filter(function(x){return x.id===f.editingId;})[0];
    if(!old){f.error='התיקון נמחק בינתיים';return null;}
    var upd=Object.assign(clone(old),base);
    if(depPay)upd.payments=(upd.payments||[]).concat([depPay]);
    if(old.status==='waiting'){upd.status='progress';upd.completedAt=null;upd.warrantyMonths=c.warrantyMonths;}
    return upd;
  }
  if(f.warrantyOf){base.warrantyOf=f.warrantyOf;base.warrantyTicket=f.warrantyTicket||null;}
  return Object.assign(base,{id:uid(),createdAt:todayStr(),createdTs:Date.now(),status:'progress',completedAt:null,warrantyMonths:c.warrantyMonths,payments:depPay?[depPay]:[]});
}

    (cardFlags(r))+'<div class="row between"><span class="price">'+money(total(r))+'</span><span class="muted sm num">'+(r.ticket?'#'+r.ticket+' · ':'')+fmtDate(r.createdAt)+(r.createdTs?' '+hm(r.createdTs):'')+'</span></div>'+
    ((r.status!=='progress'||r.completedAt)?'<div class="warr '+w.state+'">🛡 '+esc(w.text)+'</div>':'')+
  '</div>';
}
function viewList(){
  if(S.noStore)return noStoreHtml();
  if(!S.ready.repairs||!S.ready.catalog)return loadingHtml('טוען תיקונים…');
  var q=listState.q.trim().toLowerCase(),qd=q.replace(/\D/g,'');
  var rows=S.repairs.filter(function(r){
    if(listState.status==='stale'){if(!isStale(r))return false;}
    else if(listState.status==='debt'){if(!(balance(r)>0&&(r.status==='ready'||r.status==='delivered')))return false;}
    else if(listState.status!=='all'&&r.status!==listState.status)return false;
    if(listState.cat!=='all'&&r.catId!==listState.cat)return false;
    if(q){
      var hay=(r.name+' '+(r.device||'')+' '+(r.ticket?'#'+r.ticket+' '+r.ticket:'')+' '+r.items.map(function(i){return i.name;}).join(' ')).toLowerCase();
      if(!(hay.indexOf(q)>-1||(qd&&String(r.phone).replace(/\D/g,'').indexOf(qd)>-1)))return false;
    }
    return true;
  });
  var nProg=S.repairs.filter(function(r){return r.status==='progress';}).length;
  var nReady=S.repairs.filter(function(r){return r.status==='ready';}).length;

function sha(text){
  var data=new TextEncoder().encode(text);
  return crypto.subtle.digest('SHA-256',data).then(function(b){return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');});
}

}

/* ---------- סריקת מדבקה עם Claude ---------- */
var scan=null;
function parsePhone(text){
  var phoneRe=/(05\d{8}|07\d{8}|0[23489]\d{7})/;
  var d=String(text||'').replace(/[Oo]/g,'0').replace(/[Il|]/g,'1').replace(/\D/g,'');
  if(d.indexOf('972')===0)d='0'+d.slice(3);
  var m=d.match(phoneRe);
  if(!m)return '';
  var p=m[1];
  return p.length===10?p.slice(0,3)+'-'+p.slice(3):p.slice(0,2)+'-'+p.slice(2);
}

      '<div class="btns"><label class="btn full" for="scanfile-cam">📷 צילום</label>'+
      '<label class="btn sec full" for="scanfile">🖼 בחירת תמונה קיימת</label></div>'+
      '<input type="file" id="scanfile-cam" accept="image/*" capture="environment" hidden>'+
      '<input type="file" id="scanfile" accept="image/*" hidden>';
  }else{
    h+=(scan.img?'<img src="'+scan.img+'" alt="המדבקה שצולמה" class="scanimg">':'')+
      '<p style="text-align:center;font-weight:700;margin:14px 0 4px"><span class="spin"></span>'+esc(scan.status||'')+'</p>'+
      '<div class="btns"><button class="btn sec full" data-act="scanstop">עצירה והקלדה ידנית</button></div>';
  }

function openScan(){scan={step:'pick',msg:'',img:'',status:'',ctl:null,bmp:null};scanRender();}
function closeScan(){if(scan&&scan.ctl)scan.ctl.abort();scan=null;scanRender();}
function loadBitmap(file){
  if(window.createImageBitmap)return createImageBitmap(file,{imageOrientation:'from-image'}).catch(function(){return createImageBitmap(file);});
  return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){res(im);};im.onerror=function(){rej(new Error('image'));};im.src=u;});
}
function shrink(src,max){
  var w=src.width,h=src.height,k=Math.min(1,max/Math.max(w,h));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);
  return c;
}
// חותך את התמונה לאזור המדבקה (לפי המיקום ש-Claude מצא), עם שוליים
function cropTo(src,box){
  var W=src.width,H=src.height,x0=0,y0=0,x1=W,y1=H;
  if(box&&box.length===4&&box.every(function(v){return isFinite(v);})){
    var l=Math.min(box[0],box[2]),r=Math.max(box[0],box[2]),t=Math.min(box[1],box[3]),b=Math.max(box[1],box[3]);
    if(l>=0&&t>=0&&r<=1.001&&b<=1.001&&(r-l)*(b-t)>0.004){
      var mx=(r-l)*0.12+0.02,my=(b-t)*0.12+0.02;
      x0=Math.max(0,(l-mx)*W);x1=Math.min(W,(r+mx)*W);y0=Math.max(0,(t-my)*H);y1=Math.min(H,(b+my)*H);
    }
  }
  var cw=x1-x0,ch=y1-y0,k=Math.min(1,1200/Math.max(cw,ch));
  var c=document.createElement('canvas');c.width=Math.max(1,Math.round(cw*k));c.height=Math.max(1,Math.round(ch*k));
  c.getContext('2d').drawImage(src,x0,y0,cw,ch,0,0,c.width,c.height);
  return c;
}
function handleScanFile(file){
  if(!file||!scan)return;
  scan.step='busy';scan.status='טוען תמונה…';scan.msg='';scanRender();
  loadBitmap(file).then(function(bmp){
    if(!scan)return;
    scan.bmp=bmp;scan.img=shrink(bmp,640).toDataURL('image/jpeg',0.75);
    if(!sampleFn||!imgOK){finishScan(null,'');return;}
    var big=shrink(bmp,1600);
    return new Promise(function(res){big.toBlob(res,'image/jpeg',0.9);}).then(function(blob){return readSticker(blob);});
  }).catch(function(){
    if(scan){scan.step='pick';scan.msg='לא הצלחתי לפתוח את התמונה. נסה תמונה אחרת.';scanRender();}
  });
}
// אחרי הקריאה: ממלא את הטופס, שומר את תמונת המדבקה לטופס וסוגר את החלון
function finishScan(res,msg){
  if(!scan||!form)return;
  var box=res&&Array.isArray(res.box)?res.box.map(Number):null;
  var crop=cropTo(scan.bmp,box);
  form.stickerImg=crop.toDataURL('image/jpeg',0.85);
  form.stickerBlob=null;
  crop.toBlob(function(b){if(form)form.stickerBlob=b;},'image/jpeg',0.85);
  var name='',phone='';
  if(res){
    name=String(res.name||'').trim();
    var raw=String(res.phone||'');phone=parsePhone(raw)||raw.trim();
    if(name)form.name=name;
    if(phone)form.phone=phone;
  }
  if(msg)form.scanMsg=msg;
  else if(name&&phone)form.scanMsg='השם והטלפון נקראו מהמדבקה. כדאי להעיף מבט שהם נכונים.';
  else if(name||phone)form.scanMsg='רק חלק נקרא מהמדבקה. השלם את החסר לפי התמונה.';
  else form.scanMsg='המדבקה לא נקראה. הקלד את השם והטלפון לפי התמונה.';
  form.scanOk=!!(name&&phone)&&!msg;
  closeScan();render();
  var el=document.getElementById('f-name');if(el)el.scrollIntoView({block:'center'});
}
function readSticker(blob){
  scan.status='Claude קורא את המדבקה…';scanRender();
  var ctl=new AbortController();scan.ctl=ctl;
  var prompt='The image is a photo of a sticker on a device brought to a repair shop in Israel. '+
    'The sticker has the customer\'s name (usually Hebrew, often in Hebrew cursive handwriting written with a pen) and, below it, an Israeli phone number (usually 10 digits starting with 05). '+
    'The sticker may be small in the photo; ignore any printed text on the device itself (model names, buttons, labels). '+
    'Read the name and the phone number exactly as written. Write the name in Hebrew print letters, keeping its spelling. '+
    'If something cannot be read, use an empty string for it; do not guess. '+
    'Also give the sticker\'s position in the image as "box": [left, top, right, bottom], each a fraction of the image width or height between 0 and 1. '+
    'Reply with only JSON: {"name": "...", "phone": "...", "box": [0.1, 0.2, 0.6, 0.5]}';
  return sampleFn.json(prompt,{images:[blob],signal:ctl.signal}).then(function(r){
    if(!scan||scan.ctl!==ctl)return;
    scan.ctl=null;finishScan(r||{},'');
  }).catch(function(e){
    if(!scan||scan.ctl!==ctl)return;
    var code=e&&e.code,msg;
    if(code==='cancelled')msg='הקלד את השם והטלפון לפי התמונה.';
    else if(code==='not_granted'||code==='sampling_disabled'||code==='images_unavailable'||code==='not_declared'){msg='הקריאה האוטומטית לא אושרה. הקלד לפי התמונה.';imgOK=false;}
    else if(code==='rate_limited')msg='יותר מדי בקשות כרגע. הקלד לפי התמונה, או צלם שוב בעוד דקה.';
    else if(code==='session_expired')msg='צריך להתחבר שוב לחשבון Claude. בינתיים הקלד לפי התמונה.';
    else msg='הקריאה האוטומטית נכשלה. הקלד לפי התמונה או צלם שוב.';
    scan.ctl=null;finishScan(null,msg);
  });
}

/* ---------- תשלומים, הודעות, ירושלים, סיכום, תעודה ---------- */
function paidSum(r){var t=0;(r.payments||[]).forEach(function(p){t+=Number(p.amount)||0;});return t;}
function balance(r){return Math.max(0,total(r)-paidSum(r));}
function daysSince(d){return d?Math.round((parseDay(todayStr())-parseDay(d))/864e5):0;}
function isStale(r){return r.status==='ready'&&r.completedAt&&daysSince(r.completedAt)>=Number(setv('staleDays')||7);}
function nextThursday(){var d=parseDay(todayStr());while(d.getDay()!==4)d.setDate(d.getDate()+1);return d;}
function jlmSunday(){var d=nextThursday();d.setDate(d.getDate()+3);return d;}
function lastThursday(){var d=parseDay(todayStr());d.setDate(d.getDate()-1);while(d.getDay()!==4)d.setDate(d.getDate()-1);return d;}
function dayStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function deviceName(r){
  var c=cat(r.catId),base=(r.catId&&SINGLE[r.catId])||(c?c.name:'מכשיר');
  if(r.catId==='other'&&r.device)return r.device;
  return base+(r.device&&r.catId!=='other'?' '+r.device:'');
}

function cardFlags(r){

/* סיכום הכנסות (נעול בסיסמה) */
function periodRange(p){
  var t=parseDay(todayStr()),s,e;
  if(p==='today'){s=t;e=new Date(t);e.setDate(e.getDate()+1);}
  else if(p==='week'){s=new Date(t);s.setDate(s.getDate()-s.getDay());e=new Date(s);e.setDate(e.getDate()+7);}
  else if(p==='lastmonth'){s=new Date(t.getFullYear(),t.getMonth()-1,1);e=new Date(t.getFullYear(),t.getMonth(),1);}
  else{s=new Date(t.getFullYear(),t.getMonth(),1);e=new Date(t.getFullYear(),t.getMonth()+1,1);}
  return [s,e];
}
function inRange(d,rg){if(!d)return false;var x=parseDay(d);return x>=rg[0]&&x<rg[1];}

  S.repairs.forEach(function(r){(r.payments||[]).forEach(function(p){

  var curM=todayStr().slice(0,7);

var DEVICE_ID='dev-'+uid();
function maxTicketLocal(){var m=1000;S.repairs.forEach(function(r){if(Number(r.ticket)>m)m=Number(r.ticket);});return m;}
// מספר רץ משותף לכל המכשירים (נעילה קצרה כדי ששני מכשירים לא יקבלו אותו מספר)
function nextTicket(){
  if(!store)return Promise.resolve(maxTicketLocal()+1);
  if(store.nextCounter)return store.nextCounter(maxTicketLocal()).catch(function(){return maxTicketLocal()+1;});
  var ref=store.doc('config/counter'),holder=DEVICE_ID,tries=0;
  function attempt(){
    return ref.acquire({holder:holder,ttlMs:1500}).then(function(r){
      if(!r||!r.acquired){
        if(++tries>8)return maxTicketLocal()+1;
        return new Promise(function(res){setTimeout(res,250+Math.random()*350);}).then(attempt);
      }
      return ref.get().then(function(sn){
        var d=sn.exists?(sn.data()||{}):{};
        var n=Math.max(Number(d.n)||1000,maxTicketLocal())+1;
        return ref.set({n:n}).then(function(){return n;});
      });
    });
  }
  return attempt().catch(function(){return maxTicketLocal()+1;});
}
// ברקוד EAN-13: הספרה 2 (שימוש פנימי) + מספר התיקון ב-11 ספרות + ספרת ביקורת
function ean13For(ticket){
  var d='2'+('00000000000'+String(ticket)).slice(-11),sum=0;
  for(var i=0;i<12;i++)sum+=Number(d[i])*(i%2?3:1);
  return d+((10-sum%10)%10);
}
function ticketFromCode(code){
  var d=String(code).replace(/\D/g,'');

  if(d.length>=3&&d.length<=8)return parseInt(d,10);
  return null;
}

function drawLabel(r,forPrint){
  var sz=S.labelSize==='40x30'?[40,30]:[50,30];
  var k=forPrint?printDpmm():16,W=Math.round(sz[0]*k),H=Math.round(sz[1]*k);
  if(forPrint){var mw=printMaxW();if(W>mw){H=Math.round(H*mw/W);W=mw;}}
  var c=document.createElement('canvas');c.width=W;c.height=H;
  var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
  var pad=Math.round(W*0.04),font='"Rubik","Assistant",Arial,sans-serif';
  x.direction='rtl';x.textBaseline='alphabetic';
  // שורה עליונה: שם החנות + מספר תיקון
  x.font='700 '+Math.round(H*0.085)+'px '+font;x.textAlign='right';
  x.fillText(storeName(),W-pad,pad+H*0.08);
  x.direction='ltr';x.textAlign='left';x.font='700 '+Math.round(H*0.12)+'px '+font;
  x.fillText('#'+(r.ticket||''),pad,pad+H*0.1);
  // שם הלקוח, מוקטן עד שנכנס
  x.direction='rtl';x.textAlign='right';
  var fs=Math.round(H*0.2);
  do{x.font='700 '+fs+'px '+font;fs-=2;}while(x.measureText(r.name).width>W-2*pad&&fs>14);
  x.fillText(r.name,W-pad,H*0.43);
  // טלפון
  x.direction='ltr';x.textAlign='center';x.font='600 '+Math.round(H*0.13)+'px '+font;
  var lp=r.kioskPrice||(total(r)>0?total(r):0);
  if(lp){
    var ptxt=money(lp),pfs=Math.round(H*0.15),phs=Math.round(H*0.13);
    var need=function(){x.font='700 '+pfs+'px '+font;var a=x.measureText(ptxt).width;x.font='600 '+phs+'px '+font;return a+x.measureText(r.phone).width+W*0.05;};
    while(need()>W-2*pad&&phs>12){phs-=2;pfs-=2;}
    x.font='600 '+phs+'px '+font;x.textAlign='left';x.fillText(r.phone,pad,H*0.6);
    x.font='700 '+pfs+'px '+font;x.textAlign='right';x.fillText(ptxt,W-pad,H*0.6);
    x.textAlign='center';
  }else x.fillText(r.phone,W/2,H*0.6);
  // ברקוד
  var code=ean13For(r.ticket||0),bits=ean13Bits(code);
  var quiet=11,mod=Math.floor((W-2*pad)/(bits.length+2*quiet)),bw=bits.length*mod;
  var bx=Math.round((W-bw)/2),by=Math.round(H*0.66),bh=Math.round(H*0.24);
  for(var i=0;i<bits.length;i++)if(bits[i]==='1')x.fillRect(bx+i*mod,by,mod,bh);
  x.font='500 '+Math.round(H*0.065)+'px '+font;
  x.fillText(code+'   '+fmtDate(r.createdAt||todayStr())+(r.createdTs?' '+hm(r.createdTs):''),W/2,by+bh+H*0.075);
  return c;
}
function renderLabel(){
  var m=document.getElementById('labelm');
  if(!labelFor){if(m)m.remove();return;}
  if(!m){m=document.createElement('div');m.id='labelm';m.className='modal';document.body.appendChild(m);}
  var r=labelFor;
  var draw=function(){
    labelCanvas=drawLabel(r);
    m.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="row between" style="margin-bottom:8px"><div class="h2" style="margin:0">מדבקה להדפסה</div>'+
      '<button class="x-close" data-act="labelclose" aria-label="סגירה">✕</button></div>'+
      '<img class="labelprev" src="'+labelCanvas.toDataURL('image/png')+'" alt="תצוגה מקדימה של המדבקה">'+
      '<div class="row" style="margin:10px 0;gap:8px"><span class="muted sm">גודל מדבקה:</span>'+
      ['50x30','40x30'].map(function(sz){return '<button class="chip'+(S.labelSize===sz?' on':'')+'" data-act="labelsize" data-v="'+sz+'">'+sz.replace('x','×')+' מ"מ</button>';}).join('')+'</div>'+
      '<div class="btns"><button class="btn" data-act="labelprint">🖨 הדפסה עכשיו</button><button class="btn sec" data-act="labelsave">⬇️ שמירה כתמונה</button></div>'+
      '<div class="muted sm" style="margin-top:6px">מדפסת: '+printerStatusText()+'</div>'+
      '<ol class="steps sm"><li>שומרים את התמונה.</li><li>בהודעה שקופצת אחרי ההורדה (או בגלריה / בהורדות) פותחים את label-'+esc(r.ticket||'')+'.png ובוחרים <b>שיתוף ← NIIMBOT</b>.</li><li>באפליקציה של NIIMBOT לוחצים הדפסה.</li></ol>'+
      '<p class="muted sm">אם NIIMBOT לא מופיע ברשימת השיתוף: פותחים את אפליקציית NIIMBOT, בוחרים הדפסת תמונה ובוחרים את הקובץ.</p></div>';
  };
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('700 20px Rubik'),document.fonts.load('600 20px Rubik')]).catch(function(){}).then(draw);}else draw();
}
function openLabel(r){
  if(!r)return;
  if(!r.ticket){
    toast('נותן מספר לתיקון…');
    nextTicket().then(function(n){r.ticket=n;return writeRepair(r);}).then(function(){labelFor=r;renderLabel();}).catch(function(){});
    return;
  }
  labelFor=r;renderLabel();
}
function closeLabel(){labelFor=null;renderLabel();}
function saveLabel(){
  if(!labelCanvas||!dl)return;
  labelCanvas.toBlob(function(b){
    dl.save({filename:'label-'+(labelFor&&labelFor.ticket||'')+'.png',data:b}).then(function(){toast('התמונה נשמרה. עכשיו מדפיסים מאפליקציית המדפסת.');}).catch(function(e){
      if(e&&e.code!=='declined')toast('שמירת התמונה נכשלה');
    });
  },'image/png');
}

function kioskReset(){clearTimeout(kioskTimer);kioskState={done:false,exit:false,busy:false,name:'',phone:'',err:'',agree:false,sig:null};render();}
function kioskSend(){
  var ks=kioskState;if(ks.busy)return;
  var name=ks.name.trim(),phone=ks.phone.trim();
  if(name.length<2){ks.err='נא לכתוב שם';render();return;}
  if(phone.replace(/\D/g,'').length<9){ks.err='נא לכתוב מספר טלפון מלא';render();return;}
  if(kioskLoc!=='jerusalem'){var kpv=String(ks.price==null?'':ks.price).trim();if(!(kpv!==''&&Number(kpv)>0&&Number(kpv)<100000)){ks.err='נא לכתוב את המחיר שהנציג אמר';render();var kpe=document.getElementById('k-price');if(kpe)try{kpe.focus();}catch(x){}return;}}
  if(setv('kioskTerms')&&!ks.agree){ks.err='נא לאשר את התנאים';render();return;}
  if(setv('kioskTerms')&&setv('requireSig')&&!ks.sig){ks.err='נא לחתום באצבע במסגרת';render();return;}
  ks.busy=true;ks.err='';render();
  nextTicket().then(function(n){
    var rec={id:uid(),ticket:n,createdAt:todayStr(),createdTs:Date.now(),status:'waiting',origin:kioskLoc==='jerusalem'?'jerusalem':'kiosk',kioskLoc:kioskLoc,kioskPrice:(kioskLoc!=='jerusalem'&&Number(ks.price)>0)?Math.round(Number(ks.price)*100)/100:null,name:name,phone:parsePhone(phone)||phone,catId:null,items:[],device:'',notes:'',completedAt:null,warrantyMonths:0,payments:[]};
    if(setv('kioskTerms'))rec.terms={accepted:true,at:new Date().toISOString(),sig:ks.sig||null};
    return writeRepair(rec).then(function(){
      kioskState={done:true,exit:false,busy:false,name:'',phone:'',err:'',doneName:name,doneTicket:n,donePrice:rec.kioskPrice||null,printMsg:printer.connected?'המדבקה מודפסת…':'המדבקה לא הודפסה. הנציג ידפיס אותה.'};render();
      if(kioskLoc!=='jerusalem')pushNotify('new','🔧 תיקון חדש #'+n,name+(rec.kioskPrice?' · '+money(rec.kioskPrice):'')+' · נרשם בקיוסק');
      if(printer.connected)printLabelFor(rec).then(function(){if(kioskState.done&&kioskState.doneTicket===n){kioskState.printMsg='המדבקה הודפסה. הדביקו אותה על המכשיר.';render();}},function(){if(kioskState.done&&kioskState.doneTicket===n){kioskState.printMsg='ההדפסה נכשלה. הנציג ידפיס את המדבקה.';render();}});
      clearTimeout(kioskTimer);kioskTimer=setTimeout(kioskReset,12000);
    });
  }).catch(function(){ks.busy=false;ks.err='השליחה נכשלה. נסו שוב או פנו לנציג.';render();});
}
function kioskTryExit(v){
  sha((S.settings.pinSalt||'')+':'+v).then(function(h){
    if(h===S.settings.pinHash){kiosk=false;deviceOff();try{localStorage.removeItem('mt_kiosk');}catch(x){}clearTimeout(kioskTimer);go('list');}
    else{kioskState.err='סיסמה שגויה';render();var kp=document.getElementById('k-pin');if(kp)kp.focus();}
  });
}

function exportData(){
  if(!dl){toast('שמירת קובץ לא זמינה כאן');return;}
  var data=JSON.stringify({version:2,exportedAt:new Date().toISOString(),catalog:S.catalog,repairs:S.repairs},null,2);
  dl.save({filename:'mobiletech-backup-'+todayStr()+'.json',data:data}).then(function(){toast('קובץ הגיבוי נשמר');}).catch(function(e){
    if(e&&e.code!=='declined')toast('שמירת הקובץ נכשלה');
  });
}
function importData(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var d;
    try{d=JSON.parse(rd.result);if(!d||!Array.isArray(d.catalog)||!Array.isArray(d.repairs))throw 0;}
    catch(e){toast('הקובץ לא תקין. צריך קובץ גיבוי של מובייל טק.');return;}
    askConfirm('להכניס '+d.repairs.length+' תיקונים מהקובץ ולהחליף את המחירון במחירון שבקובץ? תיקונים שכבר קיימים כאן יישארו.','כן, להכניס',function(){
      S.catalog=clone(d.catalog);migrateCatalog();saveCatalog();
      var list=d.repairs.slice(),done=0;
      toast('מכניס תיקונים…');
      (function next(){
        if(!list.length){toast('הוכנסו '+done+' תיקונים');render();return;}
        var r=clone(list.shift());
        if(!r||!r.id){next();return;}
        r.id=String(r.id).replace(/[^A-Za-z0-9_\-.~:@+]/g,'')||uid();
        if(!r.createdTs)r.createdTs=parseDay(r.createdAt||todayStr()).getTime()+done;
        writeRepair(r).then(function(){done++;next();},function(){toast('ההכנסה נעצרה אחרי '+done+' תיקונים');});
      })();
    });
  };
  rd.readAsText(file);
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),c;
  switch(act){
    case 'nav':
      var v=el.getAttribute('data-v');
      if(v==='new')form=newForm();
      go(v);break;
    case 'back':
      if(view.name==='detail'||(form&&!form.editingId))go('list');
      else go('detail',{id:form.editingId});
      break;
    case 'open':payState={id:id,amount:'',method:'cash'};go('detail',{id:id});break;
    case 'fstatus':listState.status=el.getAttribute('data-v');render();break;
    case 'fcat':listState.cat=el.getAttribute('data-v');render();break;
    case 'pickcat':
      if(form.catId!==id){form.catId=id;form.model='';form.modelOther=false;initSel(form);form.custom=[];form.origin=(form.jlmPreset&&cat(id)&&cat(id).jerusalem)?'jerusalem':'store';form.vendorW=false;
        var pc=cat(id);if(pc&&!pc.items.length)form.custom.push({name:'',price:''});}
      form.error='';render();break;
    case 'pickmodel':
      form.model=el.getAttribute('data-v');form.modelOther=false;form.error='';repriceSel(form);render();break;
    case 'modelother':
      if(!form.modelOther){form.modelOther=true;form.model='';repriceSel(form);}
      render();var mo=document.getElementById('modelother');if(mo)mo.focus();break;
    case 'addcustom':
      form.custom.push({name:'',price:''});render();
      var ins=document.querySelectorAll('#customs input[data-bind=custname]');if(ins.length)ins[ins.length-1].focus();break;
    case 'delcustom':form.custom.splice(+el.getAttribute('data-i'),1);render();updateTotal();break;
    case 'origin':form.origin=el.getAttribute('data-v');render();break;
    case 'saveform':
      var rec=buildRepair();
      if(!rec){render();window.scrollTo(0,0);break;}
      el.disabled=true;
      var oldSticker=null;
      if(form.editingId){var o0=S.repairs.filter(function(x){return x.id===form.editingId;})[0];oldSticker=o0&&o0.sticker||null;}
      var blob=form.stickerBlob,keepId=form.stickerId;
      var up;
      if(blob&&assetsCap){
        el.textContent='שומר תמונה…';
        up=assetsCap.upload(blob,{type:'image/jpeg'}).then(function(x){return x.id;},function(){toast('תמונת המדבקה לא נשמרה, התיקון כן');return keepId;});
      }else{
        if(blob&&!assetsCap)toast('אין לך הרשאה לשמור תמונות. התיקון נשמר בלי התמונה.');
        up=Promise.resolve(keepId);
      }
      up.then(function(sid){
        if(sid)rec.sticker=sid;else delete rec.sticker;
        return (rec.ticket?Promise.resolve(rec.ticket):nextTicket()).then(function(n){rec.ticket=n;return writeRepair(rec);}).then(function(){
          if(oldSticker&&oldSticker!==sid&&assetsCap)assetsCap.delete(oldSticker).catch(function(){});
          form=null;toast('התיקון נשמר');
          var i=S.repairs.findIndex(function(x){return x.id===rec.id;});
          if(i>-1)S.repairs[i]=rec;else S.repairs.unshift(rec);
          go('detail',{id:rec.id});
        });
      }).catch(function(){el.disabled=false;el.textContent='שמירה';});
      break;
    case 'setstatus':
      var r=S.repairs.filter(function(x){return x.id===id;})[0];if(!r)break;
      var ns=el.getAttribute('data-v');
      r.status=ns;
      if(ns==='progress')r.completedAt=null;else if(!r.completedAt)r.completedAt=todayStr();
      if(ns==='delivered'&&!r.deliveredAt)r.deliveredAt=todayStr();
      if(ns!=='delivered'){delete r.deliveredAt;delete r.deliveredVia;}
      render();writeRepair(r).catch(function(){});
      if(ns==='ready'&&waOn())toast('אפשר לשלוח ללקוח הודעה שהמכשיר מוכן (כפתור וואטסאפ למטה)');
      break;
    case 'callhint':
      setTimeout(function(){toast('אם החייגן לא נפתח: לחיצה ארוכה על המספר ← חיוג, או "העתק" והדבקה בחייגן');},700);
      break;
    case 'copyphone':
      var num=el.getAttribute('data-v');
      try{navigator.clipboard.writeText(num).then(function(){toast('המספר הועתק');},function(){toast('סמן את המספר והעתק');});}catch(x){toast('סמן את המספר והעתק');}
      break;
    case 'edit':
      form=formFromRepair(S.repairs.filter(function(x){return x.id===id;})[0]);go('new');break;
    case 'delrepair':
      askConfirm('למחוק את התיקון? אי אפשר לשחזר, והוא יימחק גם אצל כל המשתמשים.','מחיקה',function(){
        var dr=S.repairs.filter(function(x){return x.id===id;})[0];
        removeRepair(id).then(function(){
          if(dr&&dr.sticker&&assetsCap)assetsCap.delete(dr.sticker).catch(function(){});
          toast('התיקון נמחק');go('list');
        }).catch(function(){});
      });break;
    /* הגדרות */
    case 'settab':setTab=el.getAttribute('data-v');render();break;
    case 'lock':unlocked=false;render();break;
    case 'setpin':setPin(document.getElementById('pin1').value,document.getElementById('pin2').value);break;
    case 'changepin':setPin(document.getElementById('np1').value,document.getElementById('np2').value);break;
    case 'forgotpin':
      askConfirm('לאפס את הסיסמה? אחרי האיפוס תתבקש לקבוע סיסמה חדשה.','איפוס',function(){
        saveSettings({pinHash:null,pinSalt:null}).then(function(){unlocked=false;render();}).catch(function(){});
      });break;
    case 'setbg':saveSettings({bg:el.getAttribute('data-v')}).catch(function(){});render();break;
    case 'setbrand':saveSettings({brand:el.getAttribute('data-v')}).catch(function(){});render();break;
    case 'resettheme':saveSettings({bg:null,brand:null,mode:null,font:null,zoom:null,radius:null}).catch(function(){});render();break;
    case 'additem':
      c=cat(el.getAttribute('data-cat'));
      c.items.push({id:uid(),name:'',price:null,checked:false});saveCatalog();render();
      var nm=document.querySelectorAll('[data-bind=itemname][data-cat="'+c.id+'"]');if(nm.length)nm[nm.length-1].focus();break;
    case 'delitem':
      askConfirm('למחוק את סוג התיקון מהמחירון? תיקונים שכבר נרשמו לא יושפעו.','מחיקה',function(){

function makeStore(){
  return {
    doc:function(p){return fs.doc(p);},
    collection:function(p){return fs.collection(p);},
    nextCounter:function(localMax){
      var ref=fs.doc('config/counter');
      return fs.runTransaction(function(t){
        return t.get(ref).then(function(sn){
          var d=sn.exists?(sn.data()||{}):{};
          var n=Math.max(Number(d.n)||1000,localMax)+1;
          t.set(ref,{n:n});return n;
        });
      });
    }
  };
}
// תמונות מדבקה נשמרות באוסף stickers (כל תמונה מסמך נפרד, נטענות רק כשצריך)
var blobCache={};
function blobToDataUrl(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result);};r.onerror=rej;r.readAsDataURL(b);});}
var webAssets={
  upload:function(blob){
    var id=uid();
    return blobToDataUrl(blob).then(function(data){
      if(data.length>900000)throw {code:'too_large'};
      return fs.collection('stickers').doc(id).set({data:data,at:Date.now()}).then(function(){blobCache[id]=data;return {id:id,url:data};});
    });
  },
  delete:function(id){delete blobCache[id];return fs.collection('stickers').doc(String(id)).delete();}
};
function hydrateBlobs(){
  Array.prototype.forEach.call(document.querySelectorAll('img[data-blob]'),function(img){
    var id=img.getAttribute('data-blob');if(!id||img.getAttribute('src'))return;
    if(blobCache[id]){img.src=blobCache[id];return;}
    if(!fs)return;
    fs.collection('stickers').doc(id).get().then(function(sn){
      var d=sn.exists?(sn.data()||{}).data:null;
      if(d){blobCache[id]=d;img.src=d;}else img.alt='התמונה לא נמצאה';
    }).catch(function(){});
  });
}
// הורדת קבצים רגילה בדפדפן
var webDownloads={save:function(o){
  return new Promise(function(res){
    var b=o.data instanceof Blob?o.data:new Blob([o.data]);
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=o.filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
    res({status:'saved'});
  });
}};

/* ---------- קיוסק: שלב אחרי שלב עם מקלדת משלנו ---------- */
var KSTEP={
  name:{t:'מה השם שלך?',kb:'he',max:30},
  phone:{t:'מה מספר הטלפון שלך?',kb:'num',max:13},
  price:{t:'כמה צריך לשלם?',kb:'num',max:6,ask:'💬 שאלו את הנציג כמה צריך לשלם, וכתבו את הסכום'}
};
var KB={
  he:[["'",'ק','ר','א','ט','ו','ן','ם','פ'],['ש','ד','ג','כ','ע','י','ח','ל','ך','ף'],['ז','ס','ב','ה','נ','מ','צ','ת','ץ','-']],
  en:[['q','w','e','r','t','y','u','i','o','p'],['a','s','d','f','g','h','j','k','l'],['z','x','c','v','b','n','m','-',"'"]]
};
function kSteps(){return kioskLoc==='jerusalem'?['name','phone']:['name','phone','price'];}
function kCur(){var st=kSteps(),i=Math.max(0,Math.min(kioskState.step||0,st.length-1));return {i:i,k:st[i],n:st.length,last:i===st.length-1};}
function kfmt(k,v){
  if(!v)return '<span class="kph">'+(k==='name'?'הקלידו כאן…':k==='phone'?'05X-XXXXXXX':'₪')+'</span>';
  if(k==='price')return '₪'+esc(v);
  return esc(v);
}
function kbHtml(type){
  var key=function(v,lbl,cls){return '<button type="button" class="kk'+(cls?' '+cls:'')+'" data-kk="'+esc(v)+'">'+lbl+'</button>';};
  if(type==='num'){
    var h='<div class="kpad">';
    ['1','2','3','4','5','6','7','8','9'].forEach(function(d){h+=key(d,d);});
    h+=key('BS','⌫ מחיקה','kfn')+key('0','0')+'<span></span>';
    return h+'</div>';
  }
  var rows=KB[type]||KB.he,h2='<div class="kbd">';
  rows.forEach(function(row){h2+='<div class="krow">'+row.map(function(c){return key(c,esc(c));}).join('')+'</div>';});
  h2+='<div class="krow">'+key('LANG',type==='en'?'עברית':'English','kfn')+key('SP','רווח','kspace')+key('BS','⌫ מחיקה','kfn')+'</div>';
  return h2+'</div>';
}
function kioskWizardHtml(){
  var ks=kioskState,c=kCur(),cf=KSTEP[c.k],v=String(ks[c.k]||'');
  return '<div class="kcard kwiz"><div class="kwl">'+
    '<div class="kstore display">'+esc(storeName())+(kioskLoc==='jerusalem'?' · ירושלים':'')+'</div>'+
    (c.i===0?'<p class="ksub">'+(kioskLoc==='jerusalem'?'ברוכים הבאים! השאירו שם וטלפון, ונחזור אליכם כשהתיקון מוכן.':'ברוכים הבאים! מלאו שם, טלפון ומחיר. אחרי השליחה מסרו את המוצר לנציג.')+'</p>':'')+
    '<div class="kstep">'+kSteps().map(function(s,j){return '<span class="'+(j<c.i?'done':j===c.i?'on':'')+'"></span>';}).join('')+' <b>שלב '+(c.i+1)+' מתוך '+c.n+'</b></div>'+
    '<div class="kq">'+cf.t+'</div>'+(cf.ask?'<div class="kask">'+cf.ask+'</div>':'')+
    '<div class="kfield'+(c.k!=='name'?' num':'')+'" id="kfield">'+kfmt(c.k,v)+'<span class="kcaret"></span></div>'+
    (ks.err?'<div class="err kerr">'+esc(ks.err)+'</div>':'')+
    '<div class="knav">'+(c.i>0?'<button type="button" class="btn sec kback" data-kact="back">→ אחורה</button>':'')+
    '<button type="button" class="btn kgo knext" data-kact="next"'+(ks.busy?' disabled':'')+'>'+(ks.busy?'שולח…':c.last?'שליחה ✔':'המשך ←')+'</button></div></div>'+
    '<div class="kwr">'+kbHtml(cf.kb==='he'?(ks.kbLang==='en'?'en':'he'):'num')+'</div></div>';
}
function kValid(k,v){
  v=String(v||'').trim();
  if(k==='name'&&v.length<2)return 'נא לכתוב שם';
  if(k==='phone'&&v.replace(/\D/g,'').length<9)return 'נא לכתוב מספר טלפון מלא';
  if(k==='price'&&!(Number(v)>0))return 'נא לכתוב את המחיר שהנציג אמר';
  return '';
}
function kKey(key){
  var ks=kioskState,c=kCur(),cf=KSTEP[c.k],v=String(ks[c.k]||'');
  if(key==='LANG'){ks.kbLang=ks.kbLang==='en'?'he':'en';render();return;}
  if(key==='BS')v=v.slice(0,-1);
  else if(key==='SP'){if(v&&!/ $/.test(v))v+=' ';}
  else{
    if(v.length>=cf.max)return;
    if(cf.kb==='num'&&!/^\d$/.test(key))return;
    if(c.k==='price'&&v===''&&key==='0')return;
    if(c.k==='phone'&&v.length===3&&v.indexOf('-')<0&&/^0[5-9]/.test(v))v+='-';
    v+=key;
  }
  if(c.k==='phone'&&/-$/.test(v)&&key==='BS')v=v.slice(0,-1);
  ks[c.k]=v;
  if(ks.err){ks.err='';render();return;}
  var f=document.getElementById('kfield');if(f)f.innerHTML=kfmt(c.k,v)+'<span class="kcaret"></span>';
}
function kNext(){
  var ks=kioskState,c=kCur(),e=kValid(c.k,ks[c.k]);
  if(e){ks.err=e;render();return;}
  ks.err='';
  if(c.last){if(ks.phone)ks.phone=String(ks.phone);kioskSend();return;}
  ks.step=c.i+1;render();
}
function kBack(){var ks=kioskState,c=kCur();ks.err='';ks.step=Math.max(0,c.i-1);render();}
document.addEventListener('click',function(e){
  if(!kiosk)return;
  var b=e.target.closest&&e.target.closest('[data-kk],[data-kact]');if(!b)return;
  var ks=kioskState;if(ks.busy||ks.done||ks.exit)return;
  e.preventDefault();
  if(b.hasAttribute('data-kk'))kKey(b.getAttribute('data-kk'));
  else if(b.getAttribute('data-kact')==='back')kBack();
  else kNext();
});
// גם מקלדת אמיתית עובדת (למשל במחשב)
document.addEventListener('keydown',function(e){
  if(!kiosk)return;var ks=kioskState;if(ks.busy||ks.done||ks.exit)return;
  var t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  if(e.key==='Enter'){e.preventDefault();kNext();}
  else if(e.key==='Backspace'){e.preventDefault();kKey('BS');}
  else if(e.key===' '){e.preventDefault();kKey('SP');}
  else if(e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();kKey(e.key);}
});

/* ---------- קיוסק: "עדיין כאן?" אחרי זמן בלי נגיעה ---------- */
var KIDLE={wait:30,waitPrice:60,count:15},kLastTouch=Date.now(),kIdleLeft=0;
function kHasData(){var ks=kioskState;return !!(String(ks.name||'').trim()||String(ks.phone||'').trim()||String(ks.price||'').trim()||(ks.step||0)>0);}
function kIdleClose(){var m=document.getElementById('kidle');if(m)m.remove();kIdleLeft=0;}
function kTouch(){kLastTouch=Date.now();}
['pointerdown','touchstart','keydown'].forEach(function(ev){window.addEventListener(ev,kTouch,true);});
function kIdleShow(){
  kIdleLeft=KIDLE.count;
  var m=document.createElement('div');m.id='kidle';m.className='kidle';
  m.innerHTML='<div class="kidlebox" role="dialog" aria-modal="true"><div class="kidleq">עדיין כאן?</div>'+
    '<div class="kidlenum num" id="kidlenum">'+kIdleLeft+'</div>'+
    '<p>אם לא תלחצו, הפרטים יימחקו</p>'+
    '<button type="button" class="btn block kidlego">כן, להמשיך</button></div>';
  m.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();kIdleClose();kTouch();});
  document.body.appendChild(m);
}
setInterval(function(){
  var m=document.getElementById('kidle'),ks=kioskState;
  var active=kiosk&&!ks.done&&!ks.exit&&!ks.busy&&kHasData();
  if(!active){if(m)kIdleClose();return;}
  if(m){
    kIdleLeft--;
    var n=document.getElementById('kidlenum');if(n)n.textContent=Math.max(0,kIdleLeft);
    if(kIdleLeft<=0){kIdleClose();kioskReset();kTouch();}
    return;
  }
  var lim=(kCur().k==='price'?KIDLE.waitPrice:KIDLE.wait)*1000;
  if(Date.now()-kLastTouch>=lim)kIdleShow();
},1000);

function whoName(){try{var u=authUser;if(u){if(u.displayName)return String(u.displayName).split(' ')[0];if(u.email)return String(u.email).split('@')[0];}}catch(x){}return '';}
function presenceBeat(){
  if(kiosk||!fs||S.auth!=='ok'||S.denied||document.hidden)return;
  var b={email:currentEmail(),name:whoName(),ts:Date.now()};
  try{b.srv=firebase.firestore.FieldValue.serverTimestamp();}catch(x){}
  fs.collection('presence').doc(DEV_ID).set(b).catch(function(){});
}
function presenceOff(){if(fs&&S.auth==='ok')fs.collection('presence').doc(DEV_ID).delete().catch(function(){});}
setInterval(presenceBeat,60000);
document.addEventListener('visibilitychange',function(){if(document.hidden)presenceOff();else presenceBeat();});
window.addEventListener('pagehide',presenceOff);
function presenceHtml(){
  var me=currentEmail(),seen={},list=[];
  S.presence.filter(function(p){return Date.now()-(p.ts||0)<180000;}).sort(function(a,b){return (b.ts||0)-(a.ts||0);}).forEach(function(p){
    var k=p.email||p.id;if(seen[k])return;seen[k]=1;list.push(p);
  });
  if(!list.length)return '';
  return '<div class="online">👥 מחוברים עכשיו: '+list.map(function(p){return '<span class="who1'+(p.email===me?' me':'')+'">● '+esc(p.name||p.email.split('@')[0])+(p.email===me?' (אתה)':'')+'</span>';}).join(' ')+'</div>';

STATUS.part='מחכה לחלק';STATUS.declined='לא רצה לתקן';
var SGROUPS=[['new','חדשים'],['part','מחכים לחלק'],['ready','הושלמו'],['declined','לא רצו'],['delivered','נמסרו'],['all','הכל']];
function sGroup(r){return (r.status==='waiting'||r.status==='progress')?'new':r.status;}
function sPrice(r){return (r.items&&r.items.length)?total(r):(Number(r.kioskPrice)||0);}
function fmtDT(ts){if(!ts)return '';var d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' · '+pad(d.getHours())+':'+pad(d.getMinutes());}
function rTs(r){return r.createdTs||(r.createdAt?parseDay(r.createdAt).getTime():0);}
function findRep(id){return S.repairs.filter(function(x){return x.id===id;})[0];}
function sLog(r,s,note){var e={s:s,ts:Date.now(),by:whoName()};if(note)e.note=note;r.log=(r.log||[]).concat([e]);}
function sSetPrice(r,p){

function viewSimple(){

function drawWarrantyLabel(r,months,forPrint){
  var sz=S.labelSize==='40x30'?[40,30]:[50,30];
  var k=forPrint?printDpmm():16,W=Math.round(sz[0]*k),H=Math.round(sz[1]*k);
  if(forPrint){var mw=printMaxW();if(W>mw){H=Math.round(H*mw/W);W=mw;}}
  var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';
  var pad=Math.round(W*0.04),font='"Rubik","Assistant",Arial,sans-serif';
  var from=r.completedAt||todayStr(),end=addMonths(from,months);
  x.direction='rtl';x.textAlign='right';x.font='700 '+Math.round(H*0.085)+'px '+font;x.fillText(storeName(),W-pad,pad+H*0.08);
  x.direction='ltr';x.textAlign='left';x.font='700 '+Math.round(H*0.12)+'px '+font;x.fillText('#'+(r.ticket||''),pad,pad+H*0.1);
  var y0=Math.round(H*0.2),bh0=Math.round(H*0.17);x.fillRect(pad,y0,W-2*pad,bh0);
  x.fillStyle='#fff';x.direction='rtl';x.textAlign='center';
  var t='אחריות עד '+fmtDate(end),fs=Math.round(H*0.12);
  do{x.font='700 '+fs+'px '+font;fs-=2;}while(x.measureText(t).width>W-4*pad&&fs>12);
  x.fillText(t,W/2,y0+bh0*0.74);x.fillStyle='#000';
  var rt='תוקן '+fmtDate(from),rfs=Math.round(H*0.08);x.font='600 '+rfs+'px '+font;var rw=x.measureText(rt).width;
  var nfs=Math.round(H*0.11);x.direction='rtl';x.textAlign='right';
  do{x.font='700 '+nfs+'px '+font;nfs-=2;}while(x.measureText(r.name).width>W-2*pad-rw-W*0.04&&nfs>12);
  x.fillText(r.name,W-pad,H*0.5);
  x.textAlign='left';x.font='600 '+rfs+'px '+font;x.fillText(rt,pad,H*0.5);
  var code=ean13For(r.ticket||0),bits=ean13Bits(code);
  var quiet=11,mod=Math.floor((W-2*pad)/(bits.length+2*quiet)),bw=bits.length*mod;
  var bx=Math.round((W-bw)/2),by=Math.round(H*0.56),bh=Math.round(H*0.29);
  for(var i=0;i<bits.length;i++)if(bits[i]==='1')x.fillRect(bx+i*mod,by,mod,bh);
  x.direction='rtl';x.textAlign='center';x.font='500 '+Math.round(H*0.065)+'px '+font;
  x.fillText(code+'  ·  אחריות '+(months===6?'חצי שנה':months+' חודשים'),W/2,by+bh+H*0.075);
  return c;
}
